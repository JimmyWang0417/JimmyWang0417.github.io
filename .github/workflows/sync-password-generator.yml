name: Sync password-generator

on:
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-password-generator.yml"
      - "password-generator/UPSTREAM.md"

permissions:
  contents: write

concurrency:
  group: sync-password-generator
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream and sync into password-generator/
        env:
          UPSTREAM_URL: https://github.com/zoegea/password-generator.git
          UPSTREAM_REF: master
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          git clone --depth 1 --branch "$UPSTREAM_REF" "$UPSTREAM_URL" "$WORK/upstream"
          SHA="$(git -C "$WORK/upstream" rev-parse HEAD)"
          SHORT="$(git -C "$WORK/upstream" rev-parse --short HEAD)"
          DATE="$(git -C "$WORK/upstream" log -1 --format=%cI)"
          mkdir -p password-generator
          rsync -a --delete \
            --exclude='.git' \
            --exclude='UPSTREAM.md' \
            "$WORK/upstream/" password-generator/
          {
            echo "Upstream: https://github.com/zoegea/password-generator"
            echo "Live reference: https://zoegea.github.io/password-generator/"
            echo "Synced commit: ${SHA}"
            echo "Synced at (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Upstream commit date: ${DATE}"
            echo "Maintained by: .github/workflows/sync-password-generator.yml"
          } > password-generator/UPSTREAM.md
          echo "SYNCED_SHORT=${SHORT}" >> "$GITHUB_ENV"
          echo "SYNCED_SHA=${SHA}" >> "$GITHUB_ENV"

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A password-generator
          if git diff --cached --quiet; then
            echo "No password-generator changes."
            exit 0
          fi
          git commit -m "chore: sync password-generator from zoegea@${SYNCED_SHORT}"
          git push
